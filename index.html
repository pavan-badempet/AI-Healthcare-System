    <script>
      (function () {
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var msg = event && event.reason && (event.reason.message || String(event.reason));
            if (msg && msg.indexOf('WebSocket closed without opened') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var WrappedWebSocket = function (url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (Array.isArray(protocols) &&
                (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1));
            if (isViteHmr) {
              var dummy = new EventTarget();
              dummy.readyState = 1;
              dummy.send = function () {};
              dummy.close = function () {};
              dummy.bufferedAmount = 0;
              dummy.extensions = '';
              dummy.protocol = typeof protocols === 'string' ? protocols : 'vite-hmr';
              dummy.url = String(url || '');
              dummy.binaryType = 'blob';
              setTimeout(function () {
                var openEvt = new Event('open');
                if (typeof dummy.onopen === 'function') dummy.onopen(openEvt);
                dummy.dispatchEvent(openEvt);
              }, 0);
              return dummy;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          WrappedWebSocket.prototype = NativeWebSocket.prototype;
          WrappedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          WrappedWebSocket.OPEN = NativeWebSocket.OPEN;
          WrappedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          WrappedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = WrappedWebSocket;
        }
      })();
    </script>
